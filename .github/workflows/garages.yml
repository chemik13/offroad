# Toyota dealers and workshops from OpenStreetMap (worldwide) as one file on the orphan branch "data"
# (toyota.json, served by raw.githubusercontent.com). The app shows the ones near a route.
# Runs nightly but asks only for regions whose answer is missing or older than 25 days (kept in parts/ on the same branch),
# so a build the busy public servers cut short carries on the next night instead of starting over.
name: Build Toyota garages list
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/build_garages.py", ".github/workflows/garages.yml"]
permissions:
  contents: write
concurrency: { group: garages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Last build (the list and the per-region parts)
        run: |
          git clone -q --depth 1 -b data "https://github.com/${{ github.repository }}.git" out || mkdir out
          rm -rf out/.git
      - id: build
        run: python tools/build_garages.py out
      - name: Publish to branch "data" (history not kept)
        if: always() && steps.build.outputs.changed == '1'
        run: |
          cd out
          git init -q -b data
          git config user.name "tiles-bot"
          git config user.email "tiles-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Toyota garages $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
