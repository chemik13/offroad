# Monthly: trail tiles for the countries in tools/eu_extracts.txt, published on the orphan branch "tiles-eu".
# Same format as the Israel tiles; border tiles shared by two countries are merged.
name: Build trail tiles (Europe)
on:
  schedule:
    - cron: "41 3 2 * *"   # 2nd of every month, 03:41 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/eu_extracts.txt", ".github/workflows/tiles-eu.yml"]
permissions:
  contents: write
concurrency: { group: tiles-eu, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install osmium==3.7.0
      - name: Build and publish country by country (each one is usable as soon as it is pushed)
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          # start from what is published, so countries stay available while they are rebuilt
          git clone -q --depth 1 -b tiles-eu "$REMOTE" out || (mkdir -p out && cd out && git init -q -b tiles-eu)
          cd out
          git config user.name "tiles-bot"; git config user.email "tiles-bot@users.noreply.github.com"
          git config http.postBuffer 1048576000
          first=1
          grep -v '^#' ../tools/eu_extracts.txt | grep . | while read path; do
            echo "::group::$path"
            curl -fsSL --retry 3 -o ../x.osm.pbf "https://download.geofabrik.de/$path" && ls -lh ../x.osm.pbf
            python ../tools/build_tiles.py ../x.osm.pbf . --world --merge
            rm -f ../x.osm.pbf
            git add -A; git commit -qm "$(basename $path .osm.pbf) $(date -u +%Y-%m-%d)"
            git push -q "$REMOTE" HEAD:tiles-eu
            echo "published $(basename $path -latest.osm.pbf): $(ls *.json.gz | wc -l) tiles, $(du -sh . --exclude=.git | cut -f1)"
            echo "::endgroup::"
          done
          # squash the month into one commit so the branch history does not grow
          git checkout -q --orphan squashed && git commit -qm "tiles $(date -u +%Y-%m-%d)" && git push -qf "$REMOTE" squashed:tiles-eu
