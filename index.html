<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מתכנן מסלולי שטח</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מסלולי שטח">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed topo map; white field-guide sheet; difficulty in Israeli trail-marking colors (white|color|white). */
:root{
  --bg:#ffffff; --panel:#ffffff; --stone:#f1f2ef; --stone-2:#e4e6e1; --ink:#1d2320; --muted:#646b66; --line:#d6d9d3;
  --accent:#1f6fd6; --accent-ink:#ffffff; --accent-soft:#e8f0fc; --danger:#c62f2f; --warnbg:#fff6e5; --warnline:#e0a21b;
  /* Israeli trail marks: asphalt grey · green (easy) · blue (medium) · red (hard) · black (extreme) */
  --dx:#7a4cc2; --d0:#9aa09b; --d1:#2e9b4f; --d2:#2e9b4f; --d3:#1f6fd6; --d4:#d23a2a; --d5:#1d2320;
  --display:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Rubik',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;z-index:0;background:#eef0ec}
.leaflet-control-attribution{font-size:10px}
.leaflet-top{top:calc(env(safe-area-inset-top,0px) + 58px)}
.leaflet-bar a,.leaflet-control-layers{border-radius:10px!important}
.leaflet-touch .leaflet-bar,.leaflet-touch .leaflet-control-layers{border:1px solid var(--line);box-shadow:0 1px 6px rgba(20,30,25,.12)}
header{position:fixed;top:0;inset-inline:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px;pointer-events:none}
header .brand{pointer-events:auto;white-space:nowrap;min-width:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px 7px 14px;font-family:var(--display);font-weight:600;font-size:16px;box-shadow:0 1px 6px rgba(20,30,25,.12);display:flex;align-items:center;gap:8px}
header .brand small{font-weight:400;color:var(--muted);font-size:12px}
.mark{display:inline-flex;flex-direction:column;width:14px;height:18px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.mark i{flex:1;background:#fff}.mark i:nth-child(2){background:var(--accent)}
header button{pointer-events:auto;margin-inline-start:auto}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:18px;box-shadow:0 1px 6px rgba(20,30,25,.12);cursor:pointer}
#sheet{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--panel);border-top-left-radius:16px;border-top-right-radius:16px;
  box-shadow:0 -4px 20px rgba(20,30,25,.14);border-top:1px solid var(--line);max-height:72vh;max-height:72dvh;display:flex;flex-direction:column;
  padding:6px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(14px,env(safe-area-inset-left,0px))}
#sheet.min #body{display:none}
#sheet.has-results{max-height:52vh;max-height:52dvh}
#sheet.full{max-height:calc(100vh - 70px);max-height:calc(100dvh - 70px - env(safe-area-inset-top,0px))}
#sheet.has-results .examples{display:none}
.grip{position:relative}
.grip::after{content:"";position:absolute;inset:-12px -40px}
.grip{width:40px;height:4px;border-radius:2px;background:var(--stone-2);margin:4px auto 10px;cursor:pointer;border:0;display:block}
#body{overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.promptrow{display:flex;gap:8px;align-items:stretch}
textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:16px;color:var(--ink);background:var(--stone);border:1px solid transparent;border-radius:10px;padding:10px 12px;line-height:1.45}
textarea:focus{background:#fff;border-color:var(--accent)}
textarea:focus,select:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;font:600 15px var(--body);padding:10px 16px;cursor:pointer;white-space:nowrap}
.go:hover{filter:brightness(1.06)}
.go:disabled{opacity:.5}
.examples{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.examples button{flex:none;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:13px var(--body);cursor:pointer}
.examples button:hover{border-color:var(--accent);color:var(--accent)}
#status{font-size:14px;color:var(--muted);min-height:1.2em}
#status.err{color:var(--danger)}
#status:empty{display:none}
details.params{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
details.params summary{cursor:pointer;font-weight:500;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.grid label.full{grid-column:1/-1}
.grid select,.grid input[type=number],.grid input[type=text],.grid input[type=date]{font:inherit;font-size:15px;color:var(--ink);background:var(--stone);border:1px solid transparent;border-radius:8px;padding:7px 9px;width:100%}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{flex-direction:row;align-items:center;gap:5px;background:var(--stone);border-radius:999px;padding:4px 10px;color:var(--ink);font-size:13px;font-weight:400}
.understood{font-size:14px;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:8px 10px;line-height:1.45}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;min-width:0;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 4px;font:500 13px var(--body);cursor:pointer;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.tabs button small{font-size:11px;color:var(--muted);font-weight:400}
.tabs button[aria-pressed=true] small{color:var(--accent)}
.tabs button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{padding:9px 10px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0}
.stat b{display:block;font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.02em}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--stone-2);gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:8px;height:12px;margin-inline-end:5px;vertical-align:-2px;border:1px solid var(--line);border-radius:1px;background:linear-gradient(#fff 0 30%,var(--c) 30% 70%,#fff 70%)}
.warn{font-size:13px;color:var(--ink);border-inline-start:3px solid var(--warnline);padding:6px 10px;background:var(--warnbg);border-radius:4px;line-height:1.45}
ul.pois{margin:0;padding-inline-start:18px;font-size:14px}
.actions{display:flex;gap:8px}
.actions .go{flex:1}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 14px;font:500 14px var(--body);cursor:pointer}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:18px;width:min(420px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(20,30,25,.35)}
dialog h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 6px}
dialog p{font-size:14px;color:var(--muted);line-height:1.5}
dialog input{width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--stone);color:var(--ink);direction:ltr}
.poi-ic{background:#fff;border:1px solid var(--ink);border-radius:4px;font-size:11px;font-weight:600;padding:1px 6px;white-space:nowrap;color:var(--ink);box-shadow:0 1px 3px rgba(20,30,25,.25)}
.leaflet-popup-content-wrapper{border-radius:10px}
.leaflet-popup-content{font-family:var(--body);direction:rtl;margin:10px 12px}
.flag{filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:6px;scrollbar-width:thin}
.thumbs button{flex:none;padding:0;border:0;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--stone-2);width:96px;height:72px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .none{font-size:12px;color:var(--muted)}
.poptitle{font-weight:600;font-size:14px}
.popsub{font-size:12px;color:var(--muted)}
ul.pois li{margin-bottom:8px}
#lightbox{padding:0;width:min(900px,calc(100vw - 16px));background:#111;color:#fff;border:0}
#lightbox img{display:block;width:100%;max-height:75vh;object-fit:contain;background:#111}
#lightbox .cap{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:12px}
#lightbox .cap a{color:#9cc2f5}
#lightbox .cap span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lightbox .nav{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;width:36px;height:32px;font-size:18px;cursor:pointer}
.popbtns{display:flex;gap:6px;margin-top:6px}
.popbtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font:500 13px var(--body);cursor:pointer;color:var(--ink)}
.popbtns button:hover{border-color:var(--accent);color:var(--accent)}
.hbtns{display:flex;flex:none;gap:8px;margin-inline-start:auto;pointer-events:auto}
.textbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;height:40px;padding:0 12px;font:500 14px var(--body);box-shadow:0 1px 6px rgba(20,30,25,.12);cursor:pointer}
.saverow{display:flex;gap:8px;align-items:center}
.daychips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.daychips button{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px;font:500 13px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.daychips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dayplan{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.dayrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:#fff;border-inline:0;border-bottom:0;font:inherit;color:var(--ink);text-align:start;cursor:pointer}
.dayrow:first-child{border-top:0}
.dayrow:hover{background:var(--stone)}
.dayrow .dn{font-weight:600;font-size:13px;background:var(--stone);border-radius:6px;padding:2px 7px}
.dayrow .dt{font-size:14px;min-width:0}
.dayrow .dm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dayrow .ds{grid-column:2/4;font-size:12px;color:var(--muted)}
.saverow input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--stone);border:1px solid transparent;border-radius:8px;padding:8px 10px}
.savedtag{font-size:12px;color:var(--muted)}
#library{width:min(560px,calc(100vw - 16px));max-height:calc(100vh - 40px);padding:0;display:flex;flex-direction:column}
#library:not([open]){display:none}
#library .lhead{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#library .lhead .row{display:flex;gap:8px;align-items:center}
#library .lhead h2{margin:0;flex:1}
#library input[type=text],#library input[type=url]{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--stone);border:1px solid transparent;border-radius:8px;padding:8px 10px;direction:rtl}
#library input[type=url]{direction:ltr}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#libList{overflow-y:auto;padding:6px 8px 12px;display:flex;flex-direction:column}
.litem{display:flex;gap:10px;align-items:center;text-align:start;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 8px;cursor:pointer;font:inherit;color:var(--ink)}
.litem:hover{background:var(--stone)}
.litem .ln{font-weight:500;font-size:15px}
.litem .lm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.litem .lt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.dchip{flex:none;width:10px;height:28px;border:1px solid var(--line);border-radius:2px;background:linear-gradient(#fff 0 30%,var(--c) 30% 70%,#fff 70%)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px}
.danger{background:#fff;border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:9px 14px;font:500 14px var(--body);cursor:pointer}
@media (prefers-reduced-motion:no-preference){#sheet{transition:max-height .2s}}
@media (max-width:380px){
  .go{padding:10px 12px}
  textarea{font-size:16px;padding:8px 10px}
  header .brand small{display:none}
  .stat b{font-size:17px}
}
/* tablets & desktop: floating side panel */
@media (min-width:760px){#sheet,#sheet.has-results,#sheet.full{left:auto;right:16px;bottom:16px;width:400px;border-radius:14px;border:1px solid var(--line);max-height:calc(100vh - 100px);max-height:calc(100dvh - 100px)}}
/* phones in landscape: full-height side panel so the map stays usable */
@media (orientation:landscape) and (max-height:540px){
  header{padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
  .leaflet-top{top:calc(env(safe-area-inset-top,0px) + 52px)}
  #sheet,#sheet.has-results,#sheet.full{top:0;bottom:0;left:auto;right:0;width:min(380px,50vw);max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) 12px}
  header{right:min(380px,50vw);padding-left:max(14px,env(safe-area-inset-left,0px))}
  .grip{display:none}
  #sheet.min #body{display:flex}
}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>מתכנן מסלולי שטח<small>4x4</small></div>
  <div class="hbtns"><button class="textbtn" id="libBtn">שמורים</button><button class="iconbtn" id="settingsBtn" title="הגדרות" aria-label="הגדרות">⚙</button></div>
</header>

<section id="sheet">
  <button class="grip" id="grip" aria-label="כווץ / הרחב"></button>
  <div id="body">
    <div class="promptrow">
      <textarea id="prompt" rows="2" placeholder="למשל: חצי יום בגולן מקצרין, בינוני, עם מעיין ותצפית"></textarea>
      <button class="go" id="goBtn">בנה מסלול</button>
    </div>
    <div class="examples" id="examples"></div>
    <div id="status" role="status"></div>
    <div id="understood" class="understood" hidden></div>

    <details class="params" id="params">
      <summary>הגדרות מסלול (אפשר לערוך ולבנות שוב)</summary>
      <div class="grid">
        <label class="full">נקודת התחלה<input type="text" id="pStart" placeholder="שם מקום, או לחצו על המפה"></label>
        <label>סוג<select id="pLoop"><option value="0">מנקודה לנקודה</option><option value="1">לופ (חוזר להתחלה)</option></select></label>
        <label>יעד<input type="text" id="pEnd" placeholder="ריק = המערכת תבחר יעד"></label>
        <label>משך (שעות)<input type="number" id="pHours" min="0.5" max="12" step="0.5"></label>
        <label>או אורך (ק"מ)<input type="number" id="pKm" min="2" max="600" step="1"></label>
        <label>מספר ימים<input type="number" id="pDays" min="1" max="7" step="1" value="1"></label>
        <label>שעות נסיעה ביום<input type="number" id="pHpd" min="2" max="12" step="0.5" placeholder="6"></label>
        <label>רמת קושי<select id="pDiff"><option value="easy">קל</option><option value="medium">בינוני</option><option value="hard">קשה</option></select></label>
        <label>רכב<select id="pVeh"><option value="stock">סטוק</option><option value="raised">מוגבה / צמיגי שטח</option><option value="lockers">נעילות</option></select></label>
        <label class="full">עצירות בדרך
          <span class="checks" id="pPois"></span></label>
        <label class="full">דרך (נקודות חובה, מופרדות בפסיק)<input type="text" id="pVia" placeholder="למשל: עין סהרונים, הר ארדון"></label>
        <label class="full"><span class="checks">
          <label><input type="checkbox" id="pAsph"> להימנע מכבישים</label>
          </span></label>
        <label>תאריך יציאה<input type="date" id="pDate"></label>
        <label>שטחי אש<select id="pMil"><option value="auto">לפי התאריך (סופ"ש וחגים)</option><option value="avoid">תמיד להימנע</option><option value="allow">לכלול תמיד</option></select></label>
        <label class="full" id="milNote" style="color:var(--muted)"></label>
        <label class="full">שטחי A (רשות פלסטינית)<select id="pAA"><option value="0">חסום (ברירת מחדל)</option><option value="1">לאפשר מעבר</option></select></label>
      </div>
      <div class="actions" style="margin-top:10px"><button class="ghost" id="rebuildBtn">בנה שוב עם ההגדרות</button></div>
    </details>

    <div id="results" hidden>
      <div class="tabs" id="tabs"></div>
      <div class="daychips" id="dayChips" hidden></div>
      <div class="stats" id="stats" style="margin-top:8px"></div>
      <div style="margin-top:8px"><div class="bar" id="bar"></div><div class="legend" id="legend"></div></div>
      <div id="warns" style="display:flex;flex-direction:column;gap:6px;margin-top:8px"></div>
      <div id="dayPlan"></div>
      <div id="poiList" style="margin-top:6px"></div>
      <div class="saverow" style="margin-top:10px" id="saveRow">
        <input type="text" id="routeName" aria-label="שם המסלול" placeholder="שם המסלול">
        <button class="ghost" id="saveBtn">שמירה</button>
      </div>
      <div class="savedtag" id="savedTag" hidden></div>
      <div class="actions" style="margin-top:10px">
        <button class="go" id="gpxBtn">שליחה ל-Off-Road (GPX)</button>
      </div>
      <div class="actions" id="savedActions" style="margin-top:8px" hidden>
        <button class="ghost" id="drivenBtn">סמן: נסענו בזה</button>
        <button class="danger" id="delBtn">מחיקה</button>
      </div>
      <div class="confirm" id="delConfirm" style="margin-top:8px" hidden>למחוק את המסלול מהספרייה של כולם?
        <button class="danger" id="delYes">כן, למחוק</button><button class="ghost" id="delNo">ביטול</button></div>
    </div>
  </div>
</section>

<dialog id="settings">
  <h2>הגדרות</h2>
  <p>קוד הקבוצה מחבר אתכם לספריית המסלולים המשותפת ולפענוח החכם של הפרומפט. מקבלים אותו ממי שהקים את האפליקציה.</p>
  <div style="display:flex;flex-direction:column;gap:10px">
    <label style="font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px">קוד קבוצה<input id="groupCode" type="password" autocomplete="off"></label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ===== ENGINE (pure logic, no DOM) =====
const POI_TYPES = {
  viewpoint: { he: 'תצפית', q: 'node["tourism"="viewpoint"]' },
  spring:    { he: 'מעיין', q: 'node["natural"="spring"]' },
  nightcamp: { he: 'חניון לילה', q: 'nwr["tourism"="camp_site"]' },
  camp:      { he: 'חניון יום / פיקניק', q: 'node["tourism"="picnic_site"]' },
  peak:      { he: 'פסגה',  q: 'node["natural"="peak"]["name"]' },
  historic:  { he: 'אתר היסטורי', q: 'node["historic"]["name"]' },
  water:     { he: 'גב / בור מים', q: 'node["natural"="water"]["name"]' },
};
const DIFF = {
  0: { he: 'כביש', speed: 55 },
  1: { he: 'קל מאוד (ירוק)', speed: 35 },
  2: { he: 'קל (ירוק)', speed: 24 },
  3: { he: 'בינוני (כחול)', speed: 14 },
  4: { he: 'קשה (אדום)', speed: 8 },
  5: { he: 'קשה מאוד (שחור)', speed: 4 },
};
const TARGET_D = { easy: 2, medium: 3, hard: 4 };
const VEHICLE_MAX = { stock: 3, raised: 4, lockers: 5 };
const AVG_SPEED = { easy: 22, medium: 15, hard: 9 };

function hav(a1, o1, a2, o2) {
  const R = 6371000, r = Math.PI / 180;
  const da = (a2 - a1) * r, dO = (o2 - o1) * r;
  const s = Math.sin(da / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin(dO / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

// Area A (Palestinian Authority, entry forbidden to Israeli citizens). Coarse, conservative zones
// around the main Area A towns: [lat, lon, radius_km, name]. Not an official map.
const AREA_A = [
  [32.462, 35.296, 4.0, 'ג׳נין'], [32.410, 35.280, 2.2, 'קבאטיה'], [32.452, 35.170, 1.6, 'יעבד'], [32.410, 35.200, 1.6, 'עראבה'],
  [32.322, 35.370, 2.5, 'טובאס'], [32.312, 35.030, 3.5, 'טול כרם'], [32.312, 35.120, 1.5, 'ענבתא'], [32.190, 34.970, 2.6, 'קלקיליה'],
  [32.222, 35.258, 5.0, 'שכם'], [32.083, 35.180, 2.0, 'סלפית'], [31.905, 35.205, 5.0, 'רמאללה ואל-בירה'], [31.860, 35.455, 4.5, 'יריחו'],
  [31.705, 35.200, 4.0, 'בית לחם'], [31.630, 35.160, 1.5, 'בית פג׳אר'], [31.620, 35.100, 1.5, 'בית אומר'], [31.585, 35.100, 2.0, 'חלחול'],
  [31.585, 35.020, 1.5, 'תרקומיא'], [31.530, 35.095, 4.0, 'חברון'], [31.520, 35.160, 2.0, 'בני נעים'], [31.510, 35.030, 2.5, 'דורא'],
  [31.450, 35.090, 3.0, 'יטא'], [31.400, 35.070, 2.0, 'סמוע'], [31.410, 34.970, 2.0, 'א-דאהריה'],
];
// Rough outline of Judea & Samaria, for a soft warning only.
const JS_RING = [[32.55, 35.20], [32.52, 35.56], [31.78, 35.56], [31.47, 35.45], [31.35, 35.20], [31.35, 34.90], [31.50, 34.87], [31.85, 35.00], [32.05, 34.98], [32.20, 34.95], [32.32, 35.02], [32.45, 35.08]];
function inAreaA(la, lo) {
  if (la < 31.3 || la > 32.6 || lo < 34.85 || lo > 35.6) return null;
  for (const [a, o, r, n] of AREA_A) if (hav(la, lo, a, o) <= r * 1000) return n;
  return null;
}

function wayInfo(t) {
  const hw = t.highway;
  if (!hw) return null;
  const no = v => v === 'no' || v === 'private';
  if (no(t.access) || no(t.motor_vehicle) || no(t.motorcar) || no(t.vehicle)) return null;
  if (t.smoothness === 'impassable') return null;
  if (hw === 'path') {
    const ok = t['4wd_only'] === 'yes' || t.motorcar === 'yes' || t.motor_vehicle === 'yes';
    if (!ok) return null;
  }
  const pavedSurf = ['asphalt', 'paved', 'concrete', 'paving_stones', 'chipseal'].includes(t.surface);
  const unpavedSurf = t.surface && !pavedSurf;
  if (hw !== 'track' && hw !== 'path' && !unpavedSurf) return { d: 0, asph: true, unk: false };
  if (hw === 'track' && pavedSurf) return { d: 0, asph: true, unk: false };
  let d = { grade1: 1, grade2: 2, grade3: 3, grade4: 4, grade5: 5 }[t.tracktype];
  const unk = !d && !t.smoothness;
  if (!d) d = hw === 'track' || hw === 'path' ? 3 : 2;
  const sm = { bad: 3, very_bad: 4, horrible: 5, very_horrible: 5 }[t.smoothness];
  if (sm) d = Math.max(d, sm);
  if (t['4wd_only'] === 'yes') d = Math.max(d, 4);
  if (t.surface === 'sand') d = Math.max(d, 3);
  return { d, asph: false, unk };
}

function pointInRing(lat, lon, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [ai, oi] = ring[i], [aj, oj] = ring[j];
    if ((oi > lon) !== (oj > lon) && lat < ((aj - ai) * (lon - oi)) / (oj - oi) + ai) inside = !inside;
  }
  return inside;
}

// Build graph from Overpass elements
function buildGraph(elements) {
  const idx = new Map();
  const lat = [], lon = [];
  const eA = [], eB = [], eLen = [], eD = [], eAsph = [], eMil = [], eAA = [], eJS = [], eUnk = [], eOne = [], eName = [];
  const mil = [];
  const pois = [];
  const ways = [];
  for (const el of elements) {
    if (el.tags && (el.type === 'node' || el.center) && !el.tags.highway) {
      const plat = el.type === 'node' ? el.lat : el.center.lat, plon = el.type === 'node' ? el.lon : el.center.lon;
      for (const [k, def] of Object.entries(POI_TYPES)) {
        if (matchPoi(k, el.tags)) {
          const t = el.tags;
          const poi = { type: k, lat: plat, lon: plon, name: t['name:he'] || t.name || def.he, img: t.image, commons: t.wikimedia_commons, wd: t.wikidata };
          if (k === 'nightcamp') { poi.auth = campAuth(t); poi.fee = t.fee; poi.water = t.drinking_water; poi.toilets = t.toilets; if (!t.name && !t['name:he']) poi.name = poi.auth ? 'חניון לילה' : 'אתר קמפינג'; }
          pois.push(poi); break;
        }
      }
      continue;
    } else if (el.type === 'way' && el.tags && el.tags.highway) {
      ways.push(el);
    } else if (el.tags && (el.tags.landuse === 'military' || el.tags.military)) {
      const rings = [];
      if (el.type === 'way' && el.geometry) rings.push(el.geometry.map(g => [g.lat, g.lon]));
      if (el.type === 'relation' && el.members) {
        for (const m of el.members) if (m.role !== 'inner' && m.geometry && m.geometry.length > 3) rings.push(m.geometry.map(g => [g.lat, g.lon]));
      }
      for (const r of rings) {
        let s = 90, n = -90, w = 180, e = -180;
        for (const [a, o] of r) { s = Math.min(s, a); n = Math.max(n, a); w = Math.min(w, o); e = Math.max(e, o); }
        const km2 = (n - s) * 111 * (e - w) * 96;
        const t = el.tags, nm = (t.name || '') + ' ' + (t['name:en'] || '');
        const firing = ['danger_area', 'training_area', 'range'].includes(t.military) || /שטח אש|firing/i.test(nm);
        const base = ['base', 'barracks', 'airfield', 'naval_base'].includes(t.military) || (!firing && km2 < 4);
        mil.push({ r, s, n, w, e, kind: base ? 2 : 1, name: t.name || (base ? 'בסיס צבאי' : 'שטח אש') });
      }
    }
  }
  if (ways.length) {
    let s = 90, n = -90, w = 180, ee = -180;
    for (const wy of ways) for (const g of wy.geometry || []) { if (g.lat < s) s = g.lat; if (g.lat > n) n = g.lat; if (g.lon < w) w = g.lon; if (g.lon > ee) ee = g.lon; }
    for (const [nm, la, lo, op] of KNOWN_CAMPS) {
      if (la < s || la > n || lo < w || lo > ee) continue;
      const dup = pois.find(p => p.type === 'nightcamp' && hav(p.lat, p.lon, la, lo) < 1200);
      if (dup) { dup.auth = dup.auth || op; if (!/חניון/.test(dup.name)) dup.name = nm; }
      else pois.push({ type: 'nightcamp', lat: la, lon: lo, name: nm, auth: op });
    }
  }
  const inMil = (a, o) => { let k = 0; for (const m of mil) if (a >= m.s && a <= m.n && o >= m.w && o <= m.e && pointInRing(a, o, m.r)) k = Math.max(k, m.kind); return k; };
  const nid = (id, g) => {
    let i = idx.get(id);
    if (i === undefined) { i = lat.length; idx.set(id, i); lat.push(g.lat); lon.push(g.lon); }
    return i;
  };
  for (const w of ways) {
    const info = wayInfo(w.tags);
    if (!info || !w.geometry || !w.nodes) continue;
    const one = !info.asph ? false : (w.tags.oneway === 'yes');
    const name = w.tags['name:he'] || w.tags.name || w.tags.ref || '';
    const g = w.geometry;
    const mid = g[g.length >> 1];
    const m = mil.length ? inMil(mid.lat, mid.lon) : 0;
    for (let i = 0; i + 1 < w.nodes.length; i++) {
      if (!g[i] || !g[i + 1]) continue;
      const a = nid(w.nodes[i], g[i]), b = nid(w.nodes[i + 1], g[i + 1]);
      eA.push(a); eB.push(b); eLen.push(hav(g[i].lat, g[i].lon, g[i + 1].lat, g[i + 1].lon));
      eD.push(info.d); eAsph.push(info.asph ? 1 : 0); eMil.push(m); { const ma = (g[i].lat + g[i + 1].lat) / 2, mo = (g[i].lon + g[i + 1].lon) / 2; eAA.push(inAreaA(ma, mo) ? 1 : 0); eJS.push(ma > 31.3 && ma < 32.6 && mo > 34.85 && pointInRing(ma, mo, JS_RING) ? 1 : 0); } eUnk.push(info.unk ? 1 : 0); eOne.push(one ? 1 : 0); eName.push(name);
    }
  }
  const N = lat.length, E = eA.length;
  const deg = new Int32Array(N + 1);
  for (let e = 0; e < E; e++) { deg[eA[e]]++; deg[eB[e]]++; }
  const start = new Int32Array(N + 1);
  for (let i = 0; i < N; i++) start[i + 1] = start[i] + deg[i];
  const fill = start.slice(0, N);
  const adj = new Int32Array(start[N]);
  for (let e = 0; e < E; e++) { adj[fill[eA[e]]++] = e; adj[fill[eB[e]]++] = e; }
  return {
    N, E, lat: Float64Array.from(lat), lon: Float64Array.from(lon), start, adj,
    eA: Int32Array.from(eA), eB: Int32Array.from(eB), eLen: Float64Array.from(eLen),
    eD: Uint8Array.from(eD), eAsph: Uint8Array.from(eAsph), eMil: Uint8Array.from(eMil), eAA: Uint8Array.from(eAA), eJS: Uint8Array.from(eJS),
    eUnk: Uint8Array.from(eUnk), eOne: Uint8Array.from(eOne), eName, pois, mil,
  };
}

// Authorized night camps: operated by INPA (רט"ג) or KKL, or explicitly named "חניון לילה".
const AUTH_OPS = /רשות הטבע|רט"?ג|רטג|nature and parks|inpa|קק"?ל|קרן קיימת|kkl|jnf|מועצה אזורית/i;
function campAuth(t) {
  const op = [t.operator, t.owner, t['operator:he'], t['operator:en']].filter(Boolean).join(' ');
  if (AUTH_OPS.test(op)) return /קק"?ל|קרן קיימת|kkl|jnf/i.test(op) ? 'קק"ל' : /מועצה/.test(op) ? 'מועצה אזורית' : 'רט"ג';
  if (/חניון לילה/.test((t['name:he'] || '') + ' ' + (t.name || ''))) return 'חניון לילה מוסדר';
  return null;
}
// Well-known authorized night camps (seed; merged with OSM, deduped within 1.2 km). Coordinates approximate.
const KNOWN_CAMPS = [
  ['חניון לילה בארות', 30.588, 34.889, 'רט"ג'], ['חניון לילה ממשית', 31.026, 35.064, 'רט"ג'], ['חניון לילה מצדה מערב', 31.316, 35.347, 'רט"ג'],
  ['חניון לילה חורשת טל', 33.219, 35.628, 'רט"ג'], ['חניון לילה כוכב הירדן', 32.595, 35.521, 'רט"ג'], ['חניון לילה הקסטל', 31.795, 35.144, 'רט"ג'],
];
function matchPoi(k, t) {
  switch (k) {
    case 'viewpoint': return t.tourism === 'viewpoint';
    case 'spring': return t.natural === 'spring';
    case 'nightcamp': return t.tourism === 'camp_site';
    case 'camp': return t.tourism === 'picnic_site';
    case 'peak': return t.natural === 'peak' && !!t.name;
    case 'historic': return !!t.historic && !!t.name;
    case 'water': return t.natural === 'water' && !!t.name;
  }
  return false;
}

function factors(G, p) {
  const f = new Float64Array(G.E);
  const maxD = VEHICLE_MAX[p.vehicle] || 4;
  const tD = TARGET_D[p.difficulty] || 3;
  for (let e = 0; e < G.E; e++) {
    const d = G.eD[e];
    if (G.eMil[e] === 2) { f[e] = Infinity; continue; }
    if (G.eAA[e] && !p.allow_area_a) { f[e] = Infinity; continue; }
    if (G.eMil[e] === 1 && p.avoid_military) { f[e] = Infinity; continue; }
    if (G.eAsph[e]) { f[e] = p.avoid_asphalt ? 4 : 1.6; continue; }
    if (d > maxD) { f[e] = Infinity; continue; }
    f[e] = 1 + 0.45 * Math.abs(d - tD) + (G.eUnk[e] ? 0.15 : 0);
  }
  return f;
}

class Heap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(key, val) {
    const k = this.k, v = this.v; k.push(key); v.push(val);
    let i = k.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (k[p] <= k[i]) break; [k[p], k[i]] = [k[i], k[p]]; [v[p], v[i]] = [v[i], v[p]]; i = p; }
  }
  pop() {
    const k = this.k, v = this.v; const tk = k[0], tv = v[0];
    const lk = k.pop(), lv = v.pop();
    if (k.length) {
      k[0] = lk; v[0] = lv; let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < k.length && k[l] < k[m]) m = l;
        if (r < k.length && k[r] < k[m]) m = r;
        if (m === i) break;
        [k[m], k[i]] = [k[i], k[m]]; [v[m], v[i]] = [v[i], v[m]]; i = m;
      }
    }
    return [tk, tv];
  }
}

function dijkstra(G, src, fac, used, maxCost, target = -1) {
  const dist = new Float64Array(G.N).fill(Infinity);
  const len = new Float64Array(G.N).fill(Infinity);
  const prev = new Int32Array(G.N).fill(-1);
  dist[src] = 0; len[src] = 0;
  const h = new Heap(); h.push(0, src);
  while (h.size) {
    const [d, u] = h.pop();
    if (d > dist[u]) continue;
    if (u === target || d > maxCost) break;
    for (let j = G.start[u]; j < G.start[u + 1]; j++) {
      const e = G.adj[j];
      const fwd = G.eA[e] === u;
      if (!fwd && G.eOne[e]) continue;
      const v = fwd ? G.eB[e] : G.eA[e];
      let c = G.eLen[e] * fac[e];
      if (c === Infinity) continue;
      if (used && used[e]) c *= 4;
      const nd = d + c;
      if (nd < dist[v]) { dist[v] = nd; len[v] = len[u] + G.eLen[e]; prev[v] = e; h.push(nd, v); }
    }
  }
  return { dist, len, prev, src };
}

function pathEdges(G, R, t) {
  if (R.dist[t] === Infinity) return null;
  const edges = []; let u = t;
  while (u !== R.src) {
    const e = R.prev[u]; if (e < 0) return null;
    edges.push(e); u = G.eA[e] === u ? G.eB[e] : G.eA[e];
  }
  return edges.reverse();
}

function nearestNode(G, la, lo, fac, maxM = 3000) {
  let best = -1, bd = Infinity;
  for (let i = 0; i < G.N; i++) {
    const dl = (G.lat[i] - la) * 111000, dO = (G.lon[i] - lo) * 96000;
    const d2 = dl * dl + dO * dO;
    if (d2 < bd) {
      let ok = false;
      for (let j = G.start[i]; j < G.start[i + 1]; j++) if (fac[G.adj[j]] !== Infinity) { ok = true; break; }
      if (ok) { bd = d2; best = i; }
    }
  }
  return Math.sqrt(bd) <= maxM ? best : -1;
}

function buildRoute(G, fac, stops, maxCost, used = new Uint8Array(G.E)) {
  const edges = [];
  for (let i = 0; i + 1 < stops.length; i++) {
    if (stops[i] === stops[i + 1]) continue;
    const R = dijkstra(G, stops[i], fac, used, maxCost, stops[i + 1]);
    const p = pathEdges(G, R, stops[i + 1]);
    if (!p) return null;
    for (const e of p) { used[e] = 1; edges.push(e); }
  }
  return edges;
}

function routeStats(G, edges, startNode) {
  let len = 0, hrs = 0, asph = 0, mil = 0, unk = 0, maxD = 0, reuse = 0, aa = 0, js = 0;
  const byD = [0, 0, 0, 0, 0, 0];
  const seen = new Uint8Array(G.E);
  const coords = [];
  let u = startNode;
  coords.push([G.lat[u], G.lon[u]]);
  const segs = [];
  for (const e of edges) {
    const L = G.eLen[e], d = G.eD[e];
    len += L; hrs += L / 1000 / DIFF[d].speed; byD[d] += L;
    if (G.eAsph[e]) asph += L; else maxD = Math.max(maxD, d);
    if (G.eMil[e]) mil += L; if (G.eUnk[e]) unk += L; if (G.eAA[e]) aa += L; if (G.eJS[e]) js += L;
    if (seen[e]) reuse += L; seen[e] = 1;
    const v = G.eA[e] === u ? G.eB[e] : G.eA[e];
    coords.push([G.lat[v], G.lon[v]]);
    const last = segs[segs.length - 1];
    if (last && last.d === d) last.pts.push([G.lat[v], G.lon[v]]);
    else segs.push({ d, pts: [[G.lat[u], G.lon[u]], [G.lat[v], G.lon[v]]] });
    u = v;
  }
  return { len, hrs, asph, mil, unk, aa, js, maxD, reuse, byD, coords, segs };
}

function snapPois(G, fac, types, R0, minL, maxL, authOnly = true) {
  const out = [];
  for (const p of G.pois) {
    if (types.length && !types.includes(p.type)) continue;
    if (p.type === 'nightcamp' && !p.auth && authOnly) continue;
    const n = nearestNode(G, p.lat, p.lon, fac, 500);
    if (n < 0 || R0.len[n] < minL || R0.len[n] > maxL) continue;
    if (out.some(o => o.node === n)) continue;
    out.push({ ...p, node: n });
  }

      const cand = [+best.lat, +best.lon];

  const d = r.unrated ? '' : ' · ' + (DIFF[r.maxD]?.he || '').replace(/ \(.*\)/, '');
  const nd = r.days && r.days.length > 1 ? `${r.days.length} ימים · ` : '';
  return `${nd}${a || 'מסלול'}${b && !nd ? ' ← ' + b : p.loop ? ' (לופ)' : ''} · ${(r.len / 1000).toFixed(0)} ק"מ${d}`;
}

// ---------- serialize / deserialize ----------
const R5 = x => Math.round(x * 1e5) / 1e5;
function packRoute(r) {
  const runs = []; // [d, nPoints] over coords
  r.segs.forEach((sg, i) => { const n = sg.pts.length - (i === 0 ? 0 : 1); const last = runs[runs.length - 1]; if (last && last[0] === sg.d) last[1] += n; else runs.push([sg.d, n]); });
  return {
    coords: r.coords.map(([a, o]) => [R5(a), R5(o)]),
    waypoints: r.pois.map(x => ({ lat: R5(x.lat), lon: R5(x.lon), name: x.name, type: x.type, auth: x.auth || null, fee: x.fee, water: x.water, toilets: x.toilets, img: x.img, commons: x.commons, wd: x.wd })),
    stats: { len: Math.round(r.len), hrs: +r.hrs.toFixed(2), maxD: r.maxD, byD: r.byD.map(Math.round), unk: Math.round(r.unk), mil: Math.round(r.mil), aa: Math.round(r.aa), js: Math.round(r.js), reuse: Math.round(r.reuse), runs, unrated: !!r.unrated,
      days: r.days && r.days.length > 1 ? r.days.map(d => ({ from: d.from, to: d.to, len: Math.round(d.len), hrs: +d.hrs.toFixed(2), camp: d.camp ? { name: d.camp.name, lat: R5(d.camp.lat), lon: R5(d.camp.lon), auth: d.camp.auth, type: 'nightcamp', fee: d.camp.fee, water: d.camp.water, toilets: d.camp.toilets } : null, mid: d.mid ? { name: d.mid.name, type: d.mid.type } : null })) : null },
  };
}
function unpackRoute(row) {
  const st = row.stats || {}, coords = row.coords;
  const segs = [];
  if (st.runs && !st.unrated) {
    let i = 0;
    st.runs.forEach(([d, n], k) => { const startI = k === 0 ? 0 : i - 1; const endI = k === 0 ? n : i + n; segs.push({ d, pts: coords.slice(Math.max(0, startI), endI) }); i = endI; });
  } else segs.push({ d: -1, pts: coords });
  return { coords, segs, pois: row.waypoints || [], len: st.len || pathLen(coords), hrs: st.hrs || pathLen(coords) / 1000 / 15, maxD: st.maxD ?? 0, byD: st.byD || [0, 0, 0, 0, 0, 0], unk: st.unk || 0, mil: st.mil || 0, aa: st.aa || 0, js: st.js || 0, reuse: st.reuse || 0, unrated: !!st.unrated || !st.runs, days: st.days || null };
}
function pathLen(c) { let s = 0; for (let i = 1; i < c.length; i++) s += hav(c[i - 1][0], c[i - 1][1], c[i][0], c[i][1]); return s; }
function showSaved(row) {
  const r = unpackRoute(row);
  const p = row.params || { start: { name: (r.pois[0]?.name) || null }, loop: false };
  current = { p, res: { results: [r], L: null }, G: null, sel: 0, saved: row, prompt: row.prompt || '' };
  if (row.prompt) $('prompt').value = row.prompt;
  $('understood').hidden = true; status('');
  render(0);
}

$('saveBtn').onclick = async () => {
  const r = current.res.results[current.sel];
  const name = $('routeName').value.trim() || routeTitle(r, current.p);
  $('saveBtn').disabled = true;
  try {
    const body = current.importRow ? { ...current.importRow, name } : { name, created_by: store.get('nick') || null, source: 'planned', prompt: current.prompt, params: current.p, region: current.p.start?.name || null, ...packRoute(r) };
    const j = await api('/routes', { method: 'POST', body: JSON.stringify(body) });
    current.saved = { ...j.route, coords: body.coords, waypoints: body.waypoints, params: body.params, prompt: body.prompt };
    render(current.sel);
    libCache = null; current.importRow = null;
    status('נשמר בספרייה המשותפת.');
  } catch (e) { status('השמירה נכשלה: ' + e.message, true); }
  finally { $('saveBtn').disabled = false; }
};
$('drivenBtn').onclick = async () => {
  const sv = current.saved; if (!sv) return;
  try { const j = await api('/routes/' + sv.id, { method: 'PATCH', body: JSON.stringify({ driven: !sv.driven }) }); Object.assign(sv, j.route); render(0); libCache = null; }
  catch (e) { status(e.message, true); }
};
$('delBtn').onclick = () => { $('delConfirm').hidden = false; };
$('delNo').onclick = () => { $('delConfirm').hidden = true; };
$('delYes').onclick = async () => {
  try { await api('/routes/' + current.saved.id, { method: 'DELETE' }); libCache = null; current = null; routeLayer.clearLayers(); markLayer.clearLayers(); $('results').hidden = true; status('המסלול נמחק.'); }
  catch (e) { status(e.message, true); }
};

// ---------- library ----------
let libCache = null;
async function openLibrary() {
  $('library').showModal();
  if (!hasGroup()) { $('libList').innerHTML = '<div class="empty">כדי לראות את הספרייה המשותפת, הכניסו קוד קבוצה בהגדרות (⚙).<br>ייבוא קובץ עובד גם בלי.</div>'; return; }
  if (!libCache) {
    $('libList').innerHTML = '<div class="empty">טוען…</div>';
    try { libCache = (await api('/routes')).routes; } catch (e) { $('libList').innerHTML = `<div class="empty">${e.status === 401 ? 'קוד הקבוצה לא נכון.' : 'אין חיבור לשרת.'}</div>`; return; }
  }
  drawLib();
}
function drawLib() {
  const q = $('libSearch').value.trim();
  const list = (libCache || []).filter(r => !q || [r.name, r.region, r.created_by, ...(r.tags || [])].join(' ').includes(q));
  $('libList').innerHTML = '';
  if (!list.length) { $('libList').innerHTML = `<div class="empty">${libCache?.length ? 'אין התאמות לחיפוש.' : 'הספרייה ריקה. בנו מסלול ולחצו "שמירה", או ייבאו קובץ GPX.'}</div>`; return; }
  for (const r of list) {
    const st = r.stats || {};
    const b = document.createElement('button'); b.className = 'litem';
    b.innerHTML = `<span class="dchip"></span><span class="lt"><span class="ln"></span><span class="lm"></span></span>`;
    b.querySelector('.dchip').style.setProperty('--c', DCOL(st.unrated || st.maxD == null ? 'x' : st.maxD));
    b.querySelector('.ln').textContent = r.name;
    b.querySelector('.lm').textContent = [st.len ? (st.len / 1000).toFixed(0) + ' ק"מ' : null, r.source === 'imported' ? 'מיובא' : null, r.created_by, new Date(r.created_at).toLocaleDateString('he-IL'), r.driven ? 'נסענו ✓' : null].filter(Boolean).join(' · ');
    b.onclick = async () => {
      $('libStatus').textContent = 'טוען מסלול…';
      try { const j = await api('/routes/' + r.id); $('library').close(); $('libStatus').textContent = ''; showSaved(j.route); }
      catch (e) { $('libStatus').textContent = e.message; }
    };
    $('libList').append(b);
  }
}
$('libBtn').onclick = openLibrary;
$('libClose').onclick = () => $('library').close();
$('libSearch').oninput = drawLib;

// ---------- import GPX / KML ----------
function parseTrackText(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('הקובץ לא נקרא כ-GPX או KML.');
  const num = x => parseFloat(x);
  let coords = [], wpts = [], name = '';
  if (doc.getElementsByTagName('gpx').length) {
    name = doc.querySelector('metadata > name, trk > name, rte > name')?.textContent?.trim() || '';
    for (const pt of doc.querySelectorAll('trkpt, rtept')) coords.push([num(pt.getAttribute('lat')), num(pt.getAttribute('lon'))]);
    for (const w of doc.querySelectorAll('wpt')) wpts.push({ lat: num(w.getAttribute('lat')), lon: num(w.getAttribute('lon')), name: w.querySelector('name')?.textContent?.trim() || 'נקודה', type: 'wpt' });
  } else if (doc.getElementsByTagName('kml').length) {
    name = doc.querySelector('Document > name, Folder > name')?.textContent?.trim() || '';
    for (const pm of doc.getElementsByTagName('Placemark')) {
      const nm = pm.getElementsByTagName('name')[0]?.textContent?.trim() || 'נקודה';
      for (const ls of pm.getElementsByTagName('LineString')) for (const t of (ls.getElementsByTagName('coordinates')[0]?.textContent || '').trim().split(/\s+/)) { const [lo, la] = t.split(',').map(num); if (isFinite(la)) coords.push([la, lo]); }
      for (const tr of pm.getElementsByTagName('gx:Track')) for (const c of tr.getElementsByTagName('gx:coord')) { const [lo, la] = c.textContent.trim().split(/\s+/).map(num); if (isFinite(la)) coords.push([la, lo]); }
      const pt = pm.getElementsByTagName('Point')[0];
      if (pt) { const [lo, la] = (pt.getElementsByTagName('coordinates')[0]?.textContent || '').trim().split(',').map(num); if (isFinite(la)) wpts.push({ lat: la, lon: lo, name: nm, type: 'wpt' }); }
    }
  } else throw new Error('הקובץ לא נקרא כ-GPX או KML.');
  coords = coords.filter(([a, o]) => isFinite(a) && isFinite(o));
  if (coords.length < 2) throw new Error('לא נמצא מסלול בקובץ (רק נקודות?).');
  // thin very dense tracks to ~5 m spacing
  const thin = [coords[0]];
  for (const c of coords) { const l = thin[thin.length - 1]; if (hav(l[0], l[1], c[0], c[1]) >= 5) thin.push(c); }
  if (thin[thin.length - 1] !== coords[coords.length - 1]) thin.push(coords[coords.length - 1]);
  return { coords: thin, wpts, name };
}
async function importText(text, label, sourceUrl) {
  const t = parseTrackText(text);
  let aa = 0, js = 0;
  for (let i = 1; i < t.coords.length; i++) {
    const [a1, o1] = t.coords[i - 1], [a2, o2] = t.coords[i]; const L = hav(a1, o1, a2, o2), ma = (a1 + a2) / 2, mo = (o1 + o2) / 2;
    if (inAreaA(ma, mo)) aa += L;
  }
  const len = pathLen(t.coords);
  const row = {
    name: t.name || label || 'מסלול מיובא', created_by: store.get('nick') || null, source: 'imported', source_url: sourceUrl || null,
    coords: t.coords.map(([a, o]) => [R5(a), R5(o)]), waypoints: t.wpts.slice(0, 200).map(w => ({ ...w, lat: R5(w.lat), lon: R5(w.lon) })),
    stats: { len: Math.round(len), hrs: +(len / 1000 / 15).toFixed(2), aa: Math.round(aa), js: 0, unrated: true },
    params: { start: { name: t.wpts[0]?.name || null }, loop: hav(...t.coords[0], ...t.coords[t.coords.length - 1]) < 200 },
  };
  $('library').close();
  // show as a preview; saving is explicit
  const r = unpackRoute(row);
  current = { p: row.params, res: { results: [r], L: null }, G: null, sel: 0, saved: null, prompt: '', importRow: row };
  render(0);
  $('routeName').value = row.name;
  status(`יובאו ${t.coords.length} נקודות מסלול${t.wpts.length ? ' ו-' + t.wpts.length + ' נקודות ציון' : ''}.` + (hasGroup() ? ' לחצו "שמירה" כדי להוסיף לספרייה.' : ''));
}
$('impFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { await importText(await f.text(), f.name.replace(/\.(gpx|kml)$/i, '')); } catch (err) { $('libStatus').textContent = err.message; }
  e.target.value = '';
};
$('impUrlBtn').onclick = async () => {
  const u = $('impUrl').value.trim(); if (!u) return;
  $('libStatus').textContent = 'מוריד…';
  try {
    let text;
    try { const r = await fetch(u); if (!r.ok) throw 0; text = await r.text(); }
    catch { if (!hasGroup()) throw new Error('האתר חוסם הורדה ישירה. עם קוד קבוצה ההורדה עוברת דרך השרת.'); text = (await api('/import', { method: 'POST', body: JSON.stringify({ url: u }) })).text; }
    await importText(text, '', u); $('impUrl').value = ''; $('libStatus').textContent = '';
  } catch (err) { $('libStatus').textContent = err.message; }
};

$('gpxBtn').onclick = async () => {
  const { res, sel, p } = current; const r = res.results[sel];
  const title = $('routeName').value.trim() || routeTitle(r, p);
  const gpx = toGPX(r, title);
  const fname = `offroad-${new Date().toISOString().slice(0, 10)}-${Math.round(r.len / 1000)}km.gpx`;
  const file = new File([gpx], fname, { type: 'application/gpx+xml' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = fname; document.body.append(a); a.click(); a.remove();
  status('הקובץ ירד. פתחו אותו מתוך Off-Road (ייבוא GPX).');
};
</script>
